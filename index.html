<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GARDEN CLICKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="brand">🌸 GARDEN CLICKER</div>
      <div id="prestige-info">
        <span id="singularity-count">黄金の種: 0</span>
        <button id="prestige-btn" disabled>季節を巡らせる</button>
      </div>
    </header>

    <main id="layout">

      <section id="click-area">
        <div id="stardust-total">0</div>
        <div id="stardust-label">花びら</div>
        <div id="cps-label">毎秒 +0</div>
        <div id="buff-banner" class="hidden"></div>

        <div id="core-wrap">
          <button id="core-btn" aria-label="花をクリックして花びらを集める">
            <svg id="core-svg" viewBox="0 0 200 200">
              <defs>
                <radialGradient id="centerGrad" cx="50%" cy="45%" r="60%">
                  <stop offset="0%" stop-color="#fffbe0"/>
                  <stop offset="55%" stop-color="#ffb703"/>
                  <stop offset="100%" stop-color="#e8860b"/>
                </radialGradient>
                <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffd7e6"/>
                  <stop offset="100%" stop-color="#ff6f91"/>
                </linearGradient>
              </defs>
              <g transform="translate(100,100)">
                <ellipse transform="rotate(0)"   cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(45)"  cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(90)"  cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(135)" cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(180)" cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(225)" cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(270)" cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <ellipse transform="rotate(315)" cy="-52" rx="26" ry="46" fill="url(#petalGrad)"/>
                <circle r="34" fill="url(#centerGrad)"/>
              </g>
            </svg>
          </button>

          <div id="float-layer"></div>
        </div>

        <p id="click-power-label">収穫力: +1</p>

        <div id="golden-layer"></div>
      </section>

      <section id="side-panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="buildings">庭園</button>
          <button class="tab-btn" data-tab="upgrades">アップグレード</button>
          <button class="tab-btn" data-tab="achievements">実績 <span id="achv-count">0/0</span></button>
        </div>

        <div id="tab-buildings" class="tab-content active">
          <div id="buildings-list"></div>
        </div>

        <div id="tab-upgrades" class="tab-content">
          <div id="upgrades-list"></div>
          <p id="no-upgrades" class="empty-hint">まだ購入できるアップグレードはありません。</p>
        </div>

        <div id="tab-achievements" class="tab-content">
          <div id="achievements-list"></div>
        </div>
      </section>

    </main>

  </div>

  <div id="toast-layer"></div>

  <div id="prestige-modal" class="overlay hidden">
    <div class="modal-box">
      <h2>新しい季節への準備</h2>
      <p class="modal-desc">すべての花びらと庭園をリセットして<br><b id="prestige-gain">0</b> 個の黄金の種を獲得します。</p>
      <p class="modal-desc small">黄金の種 1個につき、生産量と収穫力が永続的に +2% 上昇します。</p>
      <div class="modal-actions">
        <button id="prestige-cancel" class="btn-secondary">キャンセル</button>
        <button id="prestige-confirm" class="btn-primary">季節を巡らせる</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
