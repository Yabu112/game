<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COSMIC CLICKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="brand">✦ COSMIC CLICKER</div>
      <div id="prestige-info">
        <span id="singularity-count">特異点: 0</span>
        <button id="prestige-btn" disabled>転生する</button>
      </div>
    </header>

    <main id="layout">

      <section id="click-area">
        <div id="stardust-total">0</div>
        <div id="stardust-label">スターダスト</div>
        <div id="cps-label">毎秒 +0</div>
        <div id="buff-banner" class="hidden"></div>

        <div id="core-wrap">
          <button id="core-btn" aria-label="コアをクリックしてスターダストを採取">
            <svg id="core-svg" viewBox="0 0 200 200">
              <defs>
                <radialGradient id="coreGrad" cx="50%" cy="45%" r="60%">
                  <stop offset="0%" stop-color="#fff6da"/>
                  <stop offset="35%" stop-color="#ffd24d"/>
                  <stop offset="75%" stop-color="#b678ff"/>
                  <stop offset="100%" stop-color="#5b2fb8"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="100" r="88" fill="url(#coreGrad)"/>
            </svg>
          </button>

          <div id="float-layer"></div>
        </div>

        <p id="click-power-label">クリック威力: +1</p>

        <div id="golden-layer"></div>
      </section>

      <section id="side-panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="buildings">施設</button>
          <button class="tab-btn" data-tab="upgrades">アップグレード</button>
          <button class="tab-btn" data-tab="achievements">実績 <span id="achv-count">0/0</span></button>
        </div>

        <div id="tab-buildings" class="tab-content active">
          <div id="buildings-list"></div>
        </div>

        <div id="tab-upgrades" class="tab-content">
          <div id="upgrades-list"></div>
          <p id="no-upgrades" class="empty-hint">まだ購入できるアップグレードはありません。</p>
        </div>

        <div id="tab-achievements" class="tab-content">
          <div id="achievements-list"></div>
        </div>
      </section>

    </main>

  </div>

  <div id="toast-layer"></div>

  <div id="prestige-modal" class="overlay hidden">
    <div class="modal-box">
      <h2>特異点への転生</h2>
      <p class="modal-desc">全てのスターダストと施設をリセットして<br><b id="prestige-gain">0</b> 個の特異点コアを獲得します。</p>
      <p class="modal-desc small">特異点コア 1個につき、生産量とクリック威力が永続的に +2% 上昇します。</p>
      <div class="modal-actions">
        <button id="prestige-cancel" class="btn-secondary">キャンセル</button>
        <button id="prestige-confirm" class="btn-primary">転生する</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
